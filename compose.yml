services:
  workbench:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: sustainable-catalyst-workbench:5.0.0
    container_name: sc-workbench
    restart: unless-stopped
    environment:
      PORT: "8088"
    ports:
      - "127.0.0.1:8088:8088"
    networks:
      - sc-internal

networks:
  sc-internal:
    external: true
