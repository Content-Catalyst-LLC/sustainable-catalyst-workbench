name: workbench-backend

# The recovered production backend (sc-workbench:uvr-01-3-7) built reproducibly, with the base
# images pinned by digest and the Python packages pinned to production. The full suite may not add a
# failure beyond deploy/reproducible/uvr-01-3-7/BASELINE_FAILURES.txt, the failures of the production
# image's own suite (see docs/SC-RELEASE-01-TEST-DISPOSITION.md on the release candidate).
on:
  pull_request:
  push:
    branches: [main, "recovery/**", "release/**"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build the backend image reproducibly (packages must match the pins)
        run: deploy/reproducible/uvr-01-3-7/build.sh sc-workbench-ci
      - name: Full suite against the production baseline (no new failures)
        run: |
          set +e
          docker run --rm --network none --entrypoint python sc-workbench-ci -m pytest -q -p no:cacheprovider -rf tests > full.txt 2>&1
          set -e
          tail -n 3 full.txt
          if tail -n 1 full.txt | grep -qE " errors? |Interrupted|no tests ran"; then echo "::error::collection or setup errors"; exit 1; fi
          grep '^FAILED' full.txt | sed -E 's/^FAILED ([^ ]+).*/\1/' | LC_ALL=C sort -u > failing.txt
          LC_ALL=C sort -u deploy/reproducible/uvr-01-3-7/BASELINE_FAILURES.txt > baseline.txt
          new=$(LC_ALL=C comm -13 baseline.txt failing.txt)
          fixed=$(LC_ALL=C comm -23 baseline.txt failing.txt | wc -l)
          echo "failing: $(wc -l < failing.txt)  baseline: $(wc -l < baseline.txt)  fixed since baseline: $fixed"
          if [ -n "$new" ]; then echo "::error::new failures beyond the baseline"; echo "$new"; exit 1; fi
